<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>同一个安培环路C,两种不同曲面选择S1和S2</title>
<desc>上图:环路C套在导线上,选平坦的圆盘S1作为它的边界曲面,导线电流直接刺穿S1。下图:同一个环路C,改选一个鼓起来的口袋状曲面S2,它绕开导线不被电流刺穿,而是延伸过去穿过电容器两极板之间变化的电场区域。两种选择的边界都是同一条闭合曲线C,把S1和S2沿C拼接起来就构成一个封闭曲面,C就是这个封闭曲面上的一条截交线(类似球面被一个中间平面切开后的赤道线)。</desc>
<rect x="0" y="0" width="760" height="600" fill="#ffffff"/>

<!-- ================= PANEL A: S1 flat disk ================= -->
<text font-family="Noto Sans CJK SC" x="380" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">选择①:平面 S1</text>

<!-- circuit -->
<line x1="60" y1="180" x2="300" y2="180" stroke="#1a1a1a" stroke-width="4"/>
<line x1="460" y1="180" x2="700" y2="180" stroke="#1a1a1a" stroke-width="4"/>
<path d="M 90 180 L 115 180" stroke="#2563eb" stroke-width="4" marker-end="url(#arrIa)"/>
<text font-family="Noto Sans CJK SC" x="60" y="160" font-size="13" fill="#2563eb">电流 I</text>
<line x1="300" y1="120" x2="300" y2="240" stroke="#1a1a1a" stroke-width="5"/>
<line x1="460" y1="120" x2="460" y2="240" stroke="#1a1a1a" stroke-width="5"/>
<g stroke="#dc2626" stroke-width="2" marker-end="url(#arrEa)" opacity="0.55">
<line x1="320" y1="150" x2="440" y2="150"/>
<line x1="320" y1="180" x2="440" y2="180"/>
<line x1="320" y1="210" x2="440" y2="210"/>
</g>
<text font-family="Noto Sans CJK SC" x="380" y="270" text-anchor="middle" font-size="12" fill="#dc2626" opacity="0.8">变化的 E(极板间)</text>

<!-- loop C -->
<ellipse cx="180" cy="180" rx="16" ry="55" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="5,4"/>
<text font-family="Noto Sans CJK SC" x="60" y="90" font-size="13" fill="#6b7280">环路 C(你假想画的圈,固定不变)</text>
<path d="M 130 100 L 170 150" stroke="#6b7280" stroke-width="1.5" fill="none"/>

<!-- S1 disk: fill the ellipse -->
<ellipse cx="180" cy="180" rx="16" ry="55" fill="#2563eb" opacity="0.25"/>
<text font-family="Noto Sans CJK SC" x="120" y="290" font-size="14" fill="#2563eb" font-weight="600">S1 = 紧贴 C 的一张平的圆盘</text>
<text font-family="Noto Sans CJK SC" x="120" y="310" font-size="13" fill="#1a1a1a">导线正好垂直穿过这张盘 → 穿过 S1 的电流 = I</text>

<!-- ================= divider ================= -->
<line x1="20" y1="330" x2="740" y2="330" stroke="#e5e7eb" stroke-width="2"/>

<!-- ================= PANEL B: S2 balloon ================= -->
<text font-family="Noto Sans CJK SC" x="380" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">选择②:鼓起的曲面 S2(边界仍是同一个 C)</text>

<!-- circuit repeated -->
<line x1="60" y1="480" x2="300" y2="480" stroke="#1a1a1a" stroke-width="4"/>
<line x1="460" y1="480" x2="700" y2="480" stroke="#1a1a1a" stroke-width="4"/>
<path d="M 90 480 L 115 480" stroke="#2563eb" stroke-width="4" marker-end="url(#arrIb)"/>
<text font-family="Noto Sans CJK SC" x="60" y="460" font-size="13" fill="#2563eb">电流 I</text>
<line x1="300" y1="420" x2="300" y2="540" stroke="#1a1a1a" stroke-width="5"/>
<line x1="460" y1="420" x2="460" y2="540" stroke="#1a1a1a" stroke-width="5"/>

<!-- S2 balloon surface, drawn behind E arrows -->
<path d="M 180 425
         C 230 350 340 350 385 400
         C 410 430 410 530 385 560
         C 340 610 230 610 180 535
         A 16 55 0 0 1 180 425 Z"
      fill="#059669" opacity="0.22" stroke="#059669" stroke-width="2.5"/>

<g stroke="#dc2626" stroke-width="2" marker-end="url(#arrEb)">
<line x1="320" y1="450" x2="440" y2="450"/>
<line x1="320" y1="480" x2="440" y2="480"/>
<line x1="320" y1="510" x2="440" y2="510"/>
</g>

<!-- loop C same position -->
<ellipse cx="180" cy="480" rx="16" ry="55" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="5,4"/>

<text font-family="Noto Sans CJK SC" x="230" y="410" font-size="12" fill="#059669" font-weight="600">曲面鼓起,绕开导线(不碰导线)</text>
<path d="M 230 415 L 200 440" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#arrDot)"/>

<text font-family="Noto Sans CJK SC" x="390" y="480" font-size="12" fill="#059669" font-weight="600" text-anchor="start">曲面延伸到这里,穿过 E 场区域</text>

<text font-family="Noto Sans CJK SC" x="120" y="590" font-size="14" fill="#059669" font-weight="600">S2 = 从同一个 C 出发鼓起的"口袋",不被 I 刺穿,只被 E 穿过</text>

<defs>
<marker id="arrIa" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arrIb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arrEa" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#dc2626"/></marker>
<marker id="arrEb" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#dc2626"/></marker>
<marker id="arrDot" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#059669"/></marker>
</defs>

</svg>
