<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>边界条件推导用的压扁盒子与压扁环</title>
<desc>左图:一个像月饼一样被压扁的圆柱盒子跨在纤芯与包层分界面上,侧面积趋于零,只剩上下两个底面贡献法向分量D的通量,推出法向连续条件。右图:一个被压扁的矩形环,长边贴着分界面两侧,短边趋于零,只剩两条长边贡献切向分量E的环流,推出切向连续条件。</desc>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

<!-- ================= LEFT PANEL: pillbox (normal) ================= -->
<text font-family="Noto Sans CJK SC" x="190" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">法向分量:压扁的盒子(散度定理)</text>

<!-- interface -->
<rect x="40" y="60" width="300" height="140" fill="#dbeafe" opacity="0.5"/>
<rect x="40" y="200" width="300" height="140" fill="#dcfce7" opacity="0.5"/>
<line x1="40" y1="200" x2="340" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
<text font-family="Noto Sans CJK SC" x="55" y="85" font-size="14" fill="#1a1a1a">纤芯/包层介质 1(n1)</text>
<text font-family="Noto Sans CJK SC" x="55" y="330" font-size="14" fill="#1a1a1a">介质 2(n2)</text>

<!-- squashed pillbox: two close ellipses -->
<ellipse cx="190" cy="185" rx="70" ry="14" fill="none" stroke="#2563eb" stroke-width="3"/>
<ellipse cx="190" cy="215" rx="70" ry="14" fill="none" stroke="#2563eb" stroke-width="3"/>
<line x1="120" y1="185" x2="120" y2="215" stroke="#2563eb" stroke-width="2"/>
<line x1="260" y1="185" x2="260" y2="215" stroke="#2563eb" stroke-width="2"/>

<!-- flux arrows -->
<path d="M 190 170 L 190 130" stroke="#dc2626" stroke-width="3" marker-end="url(#arrN1)"/>
<text font-family="Noto Sans CJK SC" x="205" y="150" font-size="13" fill="#dc2626">D⊥,1(向外)</text>
<path d="M 190 230 L 190 270" stroke="#dc2626" stroke-width="3" marker-end="url(#arrN2)"/>
<text font-family="Noto Sans CJK SC" x="205" y="265" font-size="13" fill="#dc2626">D⊥,2(向里)</text>

<text font-family="Noto Sans CJK SC" x="190" y="365" text-anchor="middle" font-size="13" fill="#6b7280">盒子高度 → 0,侧面积 → 0</text>
<text font-family="Noto Sans CJK SC" x="190" y="385" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">只剩上下底面 => D⊥,1 = D⊥,2</text>

<!-- ================= divider ================= -->
<line x1="380" y1="20" x2="380" y2="400" stroke="#e5e7eb" stroke-width="2"/>

<!-- ================= RIGHT PANEL: thin loop (tangential) ================= -->
<text font-family="Noto Sans CJK SC" x="570" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">切向分量:压扁的环(斯托克斯定理)</text>

<rect x="420" y="60" width="300" height="140" fill="#dbeafe" opacity="0.5"/>
<rect x="420" y="200" width="300" height="140" fill="#dcfce7" opacity="0.5"/>
<line x1="420" y1="200" x2="720" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
<text font-family="Noto Sans CJK SC" x="435" y="85" font-size="14" fill="#1a1a1a">介质 1(n1)</text>
<text font-family="Noto Sans CJK SC" x="435" y="330" font-size="14" fill="#1a1a1a">介质 2(n2)</text>

<!-- thin rectangle loop -->
<rect x="490" y="188" width="160" height="24" fill="none" stroke="#2563eb" stroke-width="3"/>
<line x1="490" y1="200" x2="650" y2="200" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>

<!-- tangential arrows -->
<path d="M 500 194 L 600 194" stroke="#dc2626" stroke-width="3" marker-end="url(#arrT1)"/>
<text font-family="Noto Sans CJK SC" x="500" y="180" font-size="13" fill="#dc2626">E∥,1(沿长边)</text>
<path d="M 640 206 L 540 206" stroke="#dc2626" stroke-width="3" marker-end="url(#arrT2)"/>
<text font-family="Noto Sans CJK SC" x="500" y="228" font-size="13" fill="#dc2626">E∥,2(绕行方向相反)</text>

<text font-family="Noto Sans CJK SC" x="655" y="188" font-size="12" fill="#6b7280" text-anchor="middle">短边</text>
<text font-family="Noto Sans CJK SC" x="655" y="228" font-size="12" fill="#6b7280" text-anchor="middle">→0</text>

<text font-family="Noto Sans CJK SC" x="570" y="365" text-anchor="middle" font-size="13" fill="#6b7280">短边长度 → 0,环面积 → 0(右边通量项也 → 0)</text>
<text font-family="Noto Sans CJK SC" x="570" y="385" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">只剩两条长边 => E∥,1 = E∥,2</text>

<defs>
<marker id="arrN1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
<marker id="arrN2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
<marker id="arrT1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
<marker id="arrT2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
</defs>

</svg>
