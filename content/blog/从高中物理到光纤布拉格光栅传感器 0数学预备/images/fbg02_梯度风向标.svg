<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>梯度:温度场里每一点插一根风向标</title>
<desc>一个三维温度场的切面,右边有热源、左边有冷源。每一点画一根箭头,方向指向该点温度上升最快的方向,长度代表上升的速率。这就是梯度场:一个标量场输入,每一点输出一个矢量。不要想成山坡的坡度,那是二维图像,三维里想不出来。</desc>
<defs>
<radialGradient id="gh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fca5a5" stop-opacity="0.55"/><stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/></radialGradient>
<radialGradient id="gc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55"/><stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="6.6" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#1f2937"/></marker>
</defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<circle cx="545" cy="205" r="165" fill="url(#gh)"/>
<circle cx="215" cy="205" r="165" fill="url(#gc)"/>
<text font-family="Noto Sans CJK SC" x="380" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">梯度：每一点插一根风向标，指向本地升温最快的方向</text>
