<text font-family="Noto Sans CJK SC" x="380" y="368" text-anchor="middle" font-size="13" fill="#1a1a1a">箭头方向 ＝ 该点温度上升最快的方向，箭头长度 ＝ 上升速率</text>
<text font-family="Noto Sans CJK SC" x="380" y="388" text-anchor="middle" font-size="12" fill="#6b7280">标量场（温度）进，矢量场（梯度）出——不必想象成山坡，三维里想象不出来</text>
