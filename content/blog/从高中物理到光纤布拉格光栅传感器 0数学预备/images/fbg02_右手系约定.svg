<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>右手系画图约定与叉乘循环口诀</title>
<desc>固定画图习惯：x 轴朝右，y 轴朝上，z 轴朝着自己（垂直穿出屏幕，用带点的圆圈表示）。这样画出来就是右手系。叉乘按 x 到 y 到 z 到 x 的循环顺序取正号，逆着这个顺序取负号。</desc>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<defs>
<marker id="aa" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1a1a1a"/></marker>
<marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="3.6" orient="auto"><path d="M0,0 L8,3.6 L0,7.2 Z" fill="#bc5e3c"/></marker>
</defs>

<text font-family="Noto Sans CJK SC" x="200" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">固定这个画法，就不会判反</text>

<line x1="130" y1="200" x2="310" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#aa)"/>
<text font-family="Noto Sans CJK SC" x="320" y="206" font-size="15" font-weight="600" fill="#1a1a1a">x</text>
<line x1="130" y1="200" x2="130" y2="72" stroke="#1a1a1a" stroke-width="2" marker-end="url(#aa)"/>
<text font-family="Noto Sans CJK SC" x="121" y="62" font-size="15" font-weight="600" fill="#1a1a1a">y</text>
<circle cx="130" cy="200" r="11" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<circle cx="130" cy="200" r="3.2" fill="#dc2626"/>
<text font-family="Noto Sans CJK SC" x="118" y="240" font-size="15" font-weight="600" fill="#dc2626">z</text>
<text font-family="Noto Sans CJK SC" x="132" y="240" font-size="12.5" fill="#6b7280">朝着自己（穿出屏幕）</text>
<text font-family="Noto Sans CJK SC" x="200" y="276" text-anchor="middle" font-size="12.5" fill="#6b7280">x 朝右 · y 朝上 · z 出屏幕 ＝ 右手系</text>

<line x1="400" y1="20" x2="400" y2="280" stroke="#e5e7eb" stroke-width="2"/>

<text font-family="Noto Sans CJK SC" x="580" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">循环口诀，不用行列式</text>
<circle cx="580" cy="145" r="60" fill="none" stroke="#e6ddc9" stroke-width="1.4" stroke-dasharray="4 3"/>
<text font-family="Noto Sans CJK SC" x="580" y="99" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">x</text>
<text font-family="Noto Sans CJK SC" x="634" y="177" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">y</text>
<text font-family="Noto Sans CJK SC" x="526" y="177" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">z</text>
<g fill="none" stroke="#bc5e3c" stroke-width="2.4" marker-end="url(#ab)">
<path d="M 605 104 A 44 44 0 0 1 622 142"/>
<path d="M 599 181 A 44 44 0 0 1 561 181"/>
<path d="M 538 142 A 44 44 0 0 1 555 104"/>
</g>
<text font-family="Noto Sans CJK SC" x="580" y="234" text-anchor="middle" font-size="13.5" fill="#bc5e3c">顺着箭头 ＝ 正号，逆着 ＝ 负号</text>
<text font-family="Noto Sans CJK SC" x="580" y="258" text-anchor="middle" font-size="12.5" fill="#6b7280">顺：x×y=z，y×z=x，z×x=y</text>
<text font-family="Noto Sans CJK SC" x="580" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">逆：y×x=−z，z×y=−x，x×z=−y</text>
</svg>
