<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#fafafa" rx="8"/>

  <!-- ===== LEFT: Before lens ===== -->
  <!-- Parallel rays -->
  <g stroke="#2563eb" stroke-width="2" opacity="0.7">
    <line x1="30" y1="60" x2="200" y2="60"/>
    <line x1="30" y1="100" x2="200" y2="100"/>
    <line x1="30" y1="140" x2="200" y2="140"/>
    <line x1="30" y1="180" x2="200" y2="180"/>
    <line x1="30" y1="220" x2="200" y2="220"/>
    <line x1="30" y1="260" x2="200" y2="260"/>
  </g>
  <!-- Arrowheads on parallel rays -->
  <g fill="#2563eb" opacity="0.7">
    <polygon points="200,57 200,63 210,60"/>
    <polygon points="200,97 200,103 210,100"/>
    <polygon points="200,137 200,143 210,140"/>
    <polygon points="200,177 200,183 210,180"/>
    <polygon points="200,217 200,223 210,220"/>
    <polygon points="200,257 200,263 210,260"/>
  </g>

  <!-- Area bracket left -->
  <line x1="22" y1="55" x2="22" y2="265" stroke="#333" stroke-width="1.5"/>
  <line x1="18" y1="55" x2="26" y2="55" stroke="#333" stroke-width="1.5"/>
  <line x1="18" y1="265" x2="26" y2="265" stroke="#333" stroke-width="1.5"/>
  <text x="12" y="165" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,12,165)">大面积 A</text>

  <!-- Label: small angle -->
  <text x="120" y="38" text-anchor="middle" font-size="13" fill="#555">小角度 Ω</text>
  <!-- Parallel indicator arrows -->
  <line x1="90" y1="44" x2="150" y2="44" stroke="#555" stroke-width="1" marker-end="url(#arrowR)"/>

  <!-- ===== LENS ===== -->
  <!-- Lens shape -->
  <ellipse cx="260" cy="160" rx="12" ry="110" fill="none" stroke="#666" stroke-width="2.5"/>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#666" font-weight="600">透镜</text>

  <!-- ===== Arrow between ===== -->
  <line x1="310" y1="160" x2="370" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ===== RIGHT: After lens ===== -->
  <!-- Converging rays -->
  <g stroke="#dc2626" stroke-width="2" opacity="0.7">
    <line x1="400" y1="60"  x2="600" y2="155"/>
    <line x1="400" y1="100" x2="600" y2="157"/>
    <line x1="400" y1="140" x2="600" y2="159"/>
    <line x1="400" y1="180" x2="600" y2="161"/>
    <line x1="400" y1="220" x2="600" y2="163"/>
    <line x1="400" y1="260" x2="600" y2="165"/>
  </g>

  <!-- Focal point -->
  <circle cx="600" cy="160" r="5" fill="#dc2626"/>
  <text x="600" y="185" text-anchor="middle" font-size="12" fill="#dc2626">焦点</text>

  <!-- Angle arc -->
  <path d="M 560,160 Q 560,80 600,155" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="530" y="105" text-anchor="middle" font-size="13" fill="#333">大角度 Ω'</text>

  <!-- Small area indicator -->
  <line x1="608" y1="150" x2="608" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="605" y1="150" x2="611" y2="150" stroke="#333" stroke-width="1.5"/>
  <line x1="605" y1="170" x2="611" y2="170" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="164" text-anchor="start" font-size="13" fill="#333">小面积 A'</text>

  <!-- ===== Conservation equation ===== -->
  <text x="400" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="600">A × Ω  =  A' × Ω'　（Étendue 守恒）</text>
</svg>
