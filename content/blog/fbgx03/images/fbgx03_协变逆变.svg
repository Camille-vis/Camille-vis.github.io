<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>刻度加密时，位移的分量变大、偏导数的分量变小</title>
<desc>同一根箭头、同一个函数，只是把坐标尺的刻度加密一倍。位移读出来的分量数值翻倍（这叫逆变），而函数对坐标的偏导数数值减半（这叫协变）。两者随坐标尺变化的方向相反，这就是协变和逆变的全部含义。</desc>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<defs><marker id="am" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker></defs>
<text font-family="Noto Sans CJK SC" x="380" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">同一根箭头，换一把尺子：两种「分量」朝相反方向变</text>

<text font-family="Noto Sans CJK SC" x="60" y="76" font-size="13.5" font-weight="600" fill="#6b7280">原来的尺子</text>
<line x1="60" y1="130" x2="700" y2="130" stroke="#9ca3af" stroke-width="1.6"/>
<line x1="60" y1="122" x2="60" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="60" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">0</text><line x1="140" y1="122" x2="140" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="140" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">1</text><line x1="220" y1="122" x2="220" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="220" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">2</text><line x1="300" y1="122" x2="300" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="300" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">3</text><line x1="380" y1="122" x2="380" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="380" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">4</text><line x1="460" y1="122" x2="460" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="460" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">5</text><line x1="540" y1="122" x2="540" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="540" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">6</text><line x1="620" y1="122" x2="620" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="620" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">7</text><line x1="700" y1="122" x2="700" y2="138" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="700" y="156" text-anchor="middle" font-size="11" fill="#9ca3af">8</text>
<line x1="60" y1="106" x2="374" y2="106" stroke="#2563eb" stroke-width="3" marker-end="url(#am)"/>
<text font-family="Noto Sans CJK SC" x="220" y="99" text-anchor="middle" font-size="13" fill="#2563eb">位移读作 4 格</text>

<text font-family="Noto Sans CJK SC" x="60" y="218" font-size="13.5" font-weight="600" fill="#6b7280">刻度加密一倍的尺子</text>
<line x1="60" y1="272" x2="700" y2="272" stroke="#9ca3af" stroke-width="1.6"/>
<line x1="60" y1="264" x2="60" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="60" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">0</text><line x1="100" y1="264" x2="100" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="140" y1="264" x2="140" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="140" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">2</text><line x1="180" y1="264" x2="180" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="220" y1="264" x2="220" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="220" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">4</text><line x1="260" y1="264" x2="260" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="300" y1="264" x2="300" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="300" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">6</text><line x1="340" y1="264" x2="340" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="380" y1="264" x2="380" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="380" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">8</text><line x1="420" y1="264" x2="420" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="460" y1="264" x2="460" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="460" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">10</text><line x1="500" y1="264" x2="500" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="540" y1="264" x2="540" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="540" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">12</text><line x1="580" y1="264" x2="580" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="620" y1="264" x2="620" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="620" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">14</text><line x1="660" y1="264" x2="660" y2="280" stroke="#9ca3af" stroke-width="1.6"/><line x1="700" y1="264" x2="700" y2="280" stroke="#9ca3af" stroke-width="1.6"/><text font-family="Noto Sans CJK SC" x="700" y="298" text-anchor="middle" font-size="11" fill="#9ca3af">16</text>
<line x1="60" y1="248" x2="374" y2="248" stroke="#2563eb" stroke-width="3" marker-end="url(#am)"/>
<text font-family="Noto Sans CJK SC" x="220" y="241" text-anchor="middle" font-size="13" fill="#2563eb">同一根箭头，现在读作 8 格</text>

<line x1="60" y1="330" x2="700" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<text font-family="Noto Sans CJK SC" x="205" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">位移的分量：4 → 8，变大</text>
<text font-family="Noto Sans CJK SC" x="205" y="385" text-anchor="middle" font-size="12.5" fill="#6b7280">跟尺子反着变 ＝ 逆变</text>
<text font-family="Noto Sans CJK SC" x="545" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">偏导数 ∂f/∂x：1 → 0.5，变小</text>
<text font-family="Noto Sans CJK SC" x="545" y="385" text-anchor="middle" font-size="12.5" fill="#6b7280">跟尺子同向变 ＝ 协变</text>
<text font-family="Noto Sans CJK SC" x="380" y="416" text-anchor="middle" font-size="13" fill="#1a1a1a">箭头没变、函数没变，变的只是尺子——但两种「分量」朝相反方向动了</text>
</svg>